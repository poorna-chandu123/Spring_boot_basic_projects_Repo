spring:
  application:
    name: discovery-server
server:
  port: 4664
eureka:
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/  # Only the other peer
  server:
    enable-self-preservation: true
    wait-time-in-ms-when-sync-empty: 5000
  dashboard:
    enabled: true