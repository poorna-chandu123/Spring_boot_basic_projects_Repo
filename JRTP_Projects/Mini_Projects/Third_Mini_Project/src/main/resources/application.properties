spring.application.name=Third_Mini_Project



# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/third_mini_project
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# to show the Query result in the console
logging.level.com.Spring_Data_JPA.controller=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# pagination settings
pagination.default-page=0
pagination.default-size=10
pagination.max-size=50
